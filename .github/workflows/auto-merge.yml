name: Auto Merge PR

on:
  
  workflow_run:
    workflows: ["Flutter CI", "Backend CI (Node.js)"] 
    types:
      - completed

jobs:
  merge-pr:
    
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Merge PR automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --state open --json number,headRefOid --jq ".[] | select(.headRefOid == \"${{ github.event.workflow_run.head_sha }}\") | .number" | head -n 1)
          if [ -n "$PR_NUMBER" ]; then
            echo "Merging PR #$PR_NUMBER..."
            gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --merge || gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --merge
          else
            echo "No matching open PR found for SHA ${{ github.event.workflow_run.head_sha }}"
          fi