<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#0F172A; font-family:'Inter', system-ui, sans-serif;">
  <!-- Frame Background -->
  <rect width="390" height="844" rx="40" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <!-- Dynamic Notch / Island -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#000000"/>
  <!-- Status Bar -->
  <text x="32" y="32" fill="#94A3B8" font-size="12" font-weight="600">09:41</text>
  <text x="310" y="32" fill="#94A3B8" font-size="11">5G 🔋</text>

  <!-- Screen Header -->
  <rect x="0" y="50" width="390" height="60" fill="#1E293B"/>
  <text x="20" y="86" fill="#F8FAFC" font-size="18" font-weight="700">KYC Liveness Verification</text>

  <!-- Content Layer -->
  <g transform="translate(0, 110)">
    
  <!-- Progress Stepper -->
  <rect x="20" y="10" width="110" height="6" rx="3" fill="#3B82F6"/>
  <rect x="140" y="10" width="110" height="6" rx="3" fill="#3B82F6"/>
  <rect x="260" y="10" width="110" height="6" rx="3" fill="#334155"/>
  <text x="20" y="34" fill="#94A3B8" font-size="12">Step 2 of 3: Biometric Liveness Check</text>

  <!-- Camera / Liveness Viewfinder -->
  <rect x="35" y="50" width="320" height="320" rx="20" fill="#1E293B" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="195" cy="210" r="100" fill="none" stroke="#22C55E" stroke-width="4"/>
  <path d="M 195 140 L 195 280 M 125 210 L 265 210" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Liveness Instructions -->
  <rect x="60" y="390" width="270" height="44" rx="22" fill="#1E293B" stroke="#22C55E" stroke-width="1"/>
  <text x="195" y="417" fill="#22C55E" font-size="14" font-weight="600" text-anchor="middle">✓ Please Blink Your Eyes Slowly</text>

  <!-- OCR Extracted Fields -->
  <rect x="20" y="450" width="350" height="180" rx="16" fill="#1E293B"/>
  <text x="35" y="478" fill="#F8FAFC" font-size="14" font-weight="700">Extracted License Metadata (OCR)</text>

  <text x="35" y="510" fill="#94A3B8" font-size="12">License No:</text>
  <text x="140" y="510" fill="#F8FAFC" font-size="12" font-weight="600">WP-987654321</text>

  <text x="35" y="540" fill="#94A3B8" font-size="12">Field 4a (Issue):</text>
  <text x="140" y="540" fill="#F8FAFC" font-size="12" font-weight="600">12/05/2021</text>

  <text x="35" y="570" fill="#94A3B8" font-size="12">Field 11 (Expiry):</text>
  <text x="140" y="570" fill="#F8FAFC" font-size="12" font-weight="600">12/05/2029</text>

  <!-- Submit Button -->
  <rect x="20" y="650" width="350" height="50" rx="14" fill="#2563EB"/>
  <text x="195" y="681" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">COMPLETE KYC VERIFICATION</text>

  </g>
</svg>