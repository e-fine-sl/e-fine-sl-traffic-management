<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#0F172A; font-family:'Inter', system-ui, sans-serif;">
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="900" fill="#1E293B"/>
  <text x="30" y="50" fill="#F8FAFC" font-size="20" font-weight="800">e-Fine SL Admin</text>
  <text x="30" y="72" fill="#94A3B8" font-size="12">Super Admin Portal</text>

  <rect x="15" y="110" width="230" height="44" rx="10" fill="#2563EB"/>
  <text x="50" y="137" fill="#FFFFFF" font-size="14" font-weight="700">📊 Overview Analytics</text>
  <text x="50" y="190" fill="#94A3B8" font-size="14">👮 Police Officers</text>
  <text x="50" y="240" fill="#94A3B8" font-size="14">🚗 Drivers & Demerits</text>
  <text x="50" y="290" fill="#94A3B8" font-size="14">🧾 Fines & Revenue</text>
  <text x="50" y="340" fill="#94A3B8" font-size="14">⚙️ System Config</text>
  <text x="50" y="390" fill="#94A3B8" font-size="14">🔒 Active Sessions</text>

  <!-- Header -->
  <rect x="260" y="0" width="1180" height="70" fill="#1E293B"/>
  <text x="290" y="42" fill="#F8FAFC" font-size="18" font-weight="700">Dashboard Overview</text>
  <rect x="1280" y="20" width="130" height="32" rx="16" fill="#334155"/>
  <text x="1345" y="41" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Super Admin</text>

  <!-- Metric Cards -->
  <g transform="translate(290, 90)">
    <rect x="0" y="0" width="260" height="110" rx="16" fill="#1E293B"/>
    <text x="20" y="35" fill="#94A3B8" font-size="13">TOTAL DRIVERS</text>
    <text x="20" y="80" fill="#F8FAFC" font-size="32" font-weight="800">12,450</text>

    <rect x="280" y="0" width="260" height="110" rx="16" fill="#1E293B"/>
    <text x="300" y="35" fill="#94A3B8" font-size="13">ACTIVE POLICE OFFICERS</text>
    <text x="300" y="80" fill="#3B82F6" font-size="32" font-weight="800">840</text>

    <rect x="560" y="0" width="260" height="110" rx="16" fill="#1E293B"/>
    <text x="580" y="35" fill="#94A3B8" font-size="13">TOTAL REVENUE (LKR)</text>
    <text x="580" y="80" fill="#22C55E" font-size="28" font-weight="800">Rs. 4.25M</text>

    <rect x="840" y="0" width="260" height="110" rx="16" fill="#1E293B"/>
    <text x="860" y="35" fill="#94A3B8" font-size="13">SUSPENDED LICENSES</text>
    <text x="860" y="80" fill="#EF4444" font-size="32" font-weight="800">112</text>
  </g>

  <!-- Demerit System Config Panel -->
  <g transform="translate(290, 230)">
    <rect x="0" y="0" width="540" height="280" rx="16" fill="#1E293B"/>
    <text x="25" y="40" fill="#F8FAFC" font-size="16" font-weight="700">Demerit Points Engine Configuration</text>

    <text x="25" y="90" fill="#94A3B8" font-size="13">Default Demerit Points Pool:</text>
    <rect x="320" y="70" width="180" height="36" rx="8" fill="#334155"/>
    <text x="410" y="93" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">24 Points</text>

    <text x="25" y="140" fill="#94A3B8" font-size="13">Monthly Point Recovery Value:</text>
    <rect x="320" y="120" width="180" height="36" rx="8" fill="#334155"/>
    <text x="410" y="143" fill="#F8FAFC" font-size="14" font-weight="700" text-anchor="middle">+2 Points / Month</text>

    <text x="25" y="190" fill="#94A3B8" font-size="13">Recovery Cron Master Switch:</text>
    <rect x="320" y="170" width="180" height="36" rx="18" fill="#166534"/>
    <text x="410" y="193" fill="#4ADE80" font-size="13" font-weight="800" text-anchor="middle">ENABLED (ACTIVE)</text>

    <rect x="25" y="225" width="475" height="40" rx="10" fill="#2563EB"/>
    <text x="262" y="250" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">UPDATE SYSTEM CONFIGURATION</text>
  </g>
