<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#0F172A; font-family:'Inter', system-ui, sans-serif;">
  <!-- Frame Background -->
  <rect width="390" height="844" rx="40" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  <!-- Dynamic Notch / Island -->
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#000000"/>
  <!-- Status Bar -->
  <text x="32" y="32" fill="#94A3B8" font-size="12" font-weight="600">09:41</text>
  <text x="310" y="32" fill="#94A3B8" font-size="11">5G 🔋</text>

  <!-- Screen Header -->
  <rect x="0" y="50" width="390" height="60" fill="#1E293B"/>
  <text x="20" y="86" fill="#F8FAFC" font-size="18" font-weight="700">Driver Dashboard</text>

  <!-- Content Layer -->
  <g transform="translate(0, 110)">
    
  <!-- Demerit Scorecard Card -->
  <rect x="20" y="10" width="350" height="200" rx="20" fill="url(#grad1)" stroke="#3B82F6" stroke-width="1"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Gauge Circle -->
  <circle cx="195" cy="90" r="50" fill="none" stroke="#334155" stroke-width="10"/>
  <circle cx="195" cy="90" r="50" fill="none" stroke="#22C55E" stroke-width="10" stroke-dasharray="314" stroke-dashoffset="0"/>
  <text x="195" y="96" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">24 / 24</text>
  <text x="195" y="118" fill="#94A3B8" font-size="10" text-anchor="middle">DEMERIT PTS</text>

  <text x="40" y="175" fill="#22C55E" font-size="13" font-weight="700">STATUS: ACTIVE</text>
  <text x="240" y="175" fill="#F59E0B" font-size="13" font-weight="700">RATING: 5.0 ★</text>

  <!-- Quick Action SOS -->
  <rect x="20" y="230" width="168" height="60" rx="14" fill="#DC2626"/>
  <text x="104" y="265" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">🚨 EMERGENCY SOS</text>

  <rect x="202" y="230" width="168" height="60" rx="14" fill="#D97706"/>
  <text x="286" y="265" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">⚠️ REPORT HAZARD</text>

  <!-- Recent Unpaid Fine Card -->
  <text x="20" y="325" fill="#F8FAFC" font-size="16" font-weight="700">Recent Unpaid Fine</text>
  <rect x="20" y="340" width="350" height="140" rx="16" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="40" y="370" fill="#EF4444" font-size="14" font-weight="700">🧾 Speeding (Exceeding 60km/h)</text>
  <rect x="300" y="352" width="60" height="22" rx="11" fill="#EF4444"/>
  <text x="330" y="367" fill="#FFFFFF" font-size="10" font-weight="800" text-anchor="middle">UNPAID</text>

  <text x="40" y="400" fill="#94A3B8" font-size="12">Vehicle: CAB-5544 | Location: Kollupitiya</text>
  <text x="40" y="425" fill="#F8FAFC" font-size="16" font-weight="800">LKR 5,000.00</text>
  <text x="180" y="425" fill="#EF4444" font-size="12" font-weight="600">(-4 Demerit Pts)</text>

  <rect x="240" y="400" width="115" height="36" rx="10" fill="#2563EB"/>
  <text x="297" y="423" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">PAY NOW</text>

  <!-- Bottom Nav -->
  <rect x="0" y="664" width="390" height="70" fill="#1E293B"/>
  <text x="48" y="705" fill="#3B82F6" font-size="11" font-weight="700">🏠 Home</text>
  <text x="144" y="705" fill="#94A3B8" font-size="11">🧾 Fines</text>
  <text x="240" y="705" fill="#94A3B8" font-size="11">👛 Wallet</text>
  <text x="336" y="705" fill="#94A3B8" font-size="11">👤 Profile</text>

  </g>
</svg>